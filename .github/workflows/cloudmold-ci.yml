name: CloudMold backend CI

on:
  push:
    branches:
      - feature/y-shopping-jdk17
      - cloudmold/main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudmold-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MAVEN_OPTS: -Xmx3g -Dfile.encoding=UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Keep Agent Control assembled but dormant until P0 activation review
        shell: bash
        run: |
          set -euo pipefail
          properties='cloudmold-module-agent-control/cloudmold-module-agent-control-server/src/main/java/cn/iocoder/yudao/module/cloudmold/agentcontrol/AgentControlProperties.java'

          grep --quiet --fixed-strings \
            '<artifactId>cloudmold-module-agent-control-server</artifactId>' \
            yudao-server/pom.xml
          grep --quiet --fixed-strings \
            'private boolean enabled = false;' \
            "${properties}"
          grep --quiet --fixed-strings \
            'private boolean actionSubmissionEnabled = false;' \
            "${properties}"

          if grep --recursive --line-number \
            --include='*.yml' --include='*.yaml' --include='*.properties' \
            --extended-regexp 'agent-control|CLOUDMOLD_AGENT_CONTROL' \
            yudao-server/src/main/resources; then
            echo 'Agent Control must remain unconfigured and default-off until P0 activation review.' >&2
            exit 1
          fi

      - name: Test CloudMold-owned modules
        run: >-
          mvn -B -ntp -T 1C
          -pl cloudmold-module-data-contract/cloudmold-module-data-contract-server,cloudmold-module-catalog/cloudmold-module-catalog-server,cloudmold-module-identity/cloudmold-module-identity-server,cloudmold-module-merchant/cloudmold-module-merchant-server,cloudmold-module-warehouse/cloudmold-module-warehouse-server,cloudmold-module-inventory/cloudmold-module-inventory-server,cloudmold-module-listing/cloudmold-module-listing-server,cloudmold-module-order/cloudmold-module-order-server,cloudmold-module-payment/cloudmold-module-payment-server,cloudmold-module-fulfillment/cloudmold-module-fulfillment-server,cloudmold-module-aftersales/cloudmold-module-aftersales-server,cloudmold-module-promotion/cloudmold-module-promotion-server,cloudmold-module-engagement/cloudmold-module-engagement-server,cloudmold-module-customer-service/cloudmold-module-customer-service-server,cloudmold-module-agent-control/cloudmold-module-agent-control-server,cloudmold-module-ai-operations/cloudmold-module-ai-operations-server,cloudmold-module-operations-intelligence/cloudmold-module-operations-intelligence-server,cloudmold-module-token-platform/cloudmold-module-token-platform-server,cloudmold-module-risk/cloudmold-module-risk-server,cloudmold-module-gamification/cloudmold-module-gamification-server,cloudmold-module-metadata/cloudmold-module-metadata-server,cloudmold-integration-yudao/cloudmold-integration-yudao-server
          -am test

      - name: Verify CloudMold migration asset integrity
        run: bash deploy/demo/test-cloudmold-migration-manifest.sh

      - name: Test the Demo database preflight gate
        run: bash deploy/demo/test-database-preflight.sh

      - name: Install thin module artifacts
        run: >-
          mvn -B -ntp -pl yudao-server -am clean install -DskipTests
          -Dspring-boot.repackage.skip=true

      - name: Package only the executable monolith
        run: mvn -B -ntp -pl yudao-server package -DskipTests

      - name: Verify executable Spring Boot artifact
        run: >-
          unzip -p yudao-server/target/yudao-server.jar META-INF/MANIFEST.MF
          | grep --fixed-strings 'Main-Class: org.springframework.boot.loader.launch.JarLauncher'

      - name: Build immutable Demo image
        run: >-
          docker build
          --file deploy/demo/backend.Dockerfile
          --build-arg VCS_REF="${GITHUB_SHA}"
          --tag "cloudmold/backend:${GITHUB_SHA}"
          yudao-server/target
