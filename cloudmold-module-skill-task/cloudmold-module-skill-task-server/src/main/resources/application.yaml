spring:
  application:
    name: cloudmold-skill-task-executor
  main:
    web-application-type: none
    banner-mode: off
  autoconfigure:
    exclude:
      - cn.iocoder.yudao.framework.security.config.YudaoSecurityRpcAutoConfiguration
      - cn.iocoder.yudao.framework.security.config.YudaoSecurityAutoConfiguration
      - cn.iocoder.yudao.framework.security.config.YudaoWebSecurityConfigurerAdapter
      - cn.iocoder.yudao.framework.operatelog.config.YudaoOperateLogConfiguration
      - cn.iocoder.yudao.framework.operatelog.config.YudaoOperateLogRpcAutoConfiguration
      - cn.iocoder.yudao.framework.tenant.config.YudaoTenantRpcAutoConfiguration
      - cn.iocoder.yudao.framework.tenant.config.YudaoTenantAutoConfiguration
      - cn.iocoder.yudao.framework.translate.config.YudaoTranslateAutoConfiguration
      - cn.iocoder.yudao.framework.apilog.config.YudaoApiLogAutoConfiguration
      - cn.iocoder.yudao.framework.apilog.config.YudaoApiLogRpcAutoConfiguration
      - cn.iocoder.yudao.framework.swagger.config.YudaoSwaggerAutoConfiguration
      - cn.iocoder.yudao.framework.web.config.YudaoWebAutoConfiguration
      - cn.iocoder.yudao.framework.xss.config.YudaoXssAutoConfiguration
      - cn.iocoder.yudao.framework.banner.config.YudaoBannerAutoConfiguration
      - cn.iocoder.yudao.framework.encrypt.config.YudaoApiEncryptAutoConfiguration
      - cn.iocoder.yudao.framework.redis.config.YudaoRedisAutoConfiguration
      - cn.iocoder.yudao.framework.redis.config.YudaoCacheAutoConfiguration
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          url: ${CLOUDMOLD_DB_URL:jdbc:mysql://127.0.0.1:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true}
          username: ${CLOUDMOLD_DB_USERNAME:root}
          password: ${CLOUDMOLD_DB_PASSWORD:}
          driver-class-name: com.mysql.cj.jdbc.Driver

cloudmold:
  skill-task:
    registry-root: ${CLOUDMOLD_SKILL_REGISTRY_ROOT:/app/skills}
    fail-on-empty-registry: ${CLOUDMOLD_SKILL_FAIL_ON_EMPTY_REGISTRY:true}
    worker-enabled: ${CLOUDMOLD_SKILL_WORKER_ENABLED:true}
    worker-delay: ${CLOUDMOLD_SKILL_WORKER_DELAY:1s}
    lease-duration: ${CLOUDMOLD_SKILL_LEASE_DURATION:30s}
    max-backoff: ${CLOUDMOLD_SKILL_MAX_BACKOFF:5m}
    batch-size: ${CLOUDMOLD_SKILL_BATCH_SIZE:20}
    default-max-attempts: ${CLOUDMOLD_SKILL_DEFAULT_MAX_ATTEMPTS:5}
    max-payload-bytes: ${CLOUDMOLD_SKILL_MAX_PAYLOAD_BYTES:1048576}
    approval:
      hmac-secret: ${CLOUDMOLD_SKILL_TASK_APPROVAL_HMAC_SECRET:}
      legacy-hmac-enabled: ${CLOUDMOLD_SKILL_TASK_APPROVAL_LEGACY_HMAC_ENABLED:true}
      max-validity: ${CLOUDMOLD_SKILL_TASK_APPROVAL_MAX_VALIDITY:4h}
      clock-skew: ${CLOUDMOLD_SKILL_TASK_APPROVAL_CLOCK_SKEW:30s}
  rpc:
    enabled: true
    export-enabled: true
    shared-secret: ${CLOUDMOLD_RPC_SHARED_SECRET:}
    group: ${CLOUDMOLD_RPC_GROUP:cloudmold-internal}
    version: ${CLOUDMOLD_RPC_VERSION:1.0.0}
    timeout-millis: ${CLOUDMOLD_RPC_TIMEOUT_MILLIS:5000}
    max-clock-skew-seconds: ${CLOUDMOLD_RPC_MAX_CLOCK_SKEW_SECONDS:60}
    fail-on-missing-service: true
    export-service-interfaces:
      - cn.iocoder.yudao.module.cloudmold.skilltask.api.SkillTaskCommandApi
      - cn.iocoder.yudao.module.cloudmold.skilltask.api.SkillTaskQueryApi
    readiness-marker: ${CLOUDMOLD_SKILL_READINESS_MARKER:/tmp/cloudmold-skill-task-ready}

dubbo:
  application:
    name: cloudmold-skill-task-executor
    qos-enable: false
    serialize-check-status: STRICT
    check-serializable: false
    auto-trust-serialize-class: true
  registry:
    address: ${CLOUDMOLD_DUBBO_REGISTRY:nacos://127.0.0.1:8848}
    group: ${CLOUDMOLD_DUBBO_REGISTRY_GROUP:CLOUDMOLD_DUBBO}
    check: true
  config-center:
    address: ${CLOUDMOLD_DUBBO_CONFIG_CENTER:${CLOUDMOLD_DUBBO_REGISTRY:nacos://127.0.0.1:8848}}
    group: ${CLOUDMOLD_DUBBO_REGISTRY_GROUP:CLOUDMOLD_DUBBO}
  metadata-report:
    address: ${CLOUDMOLD_DUBBO_METADATA_REPORT:${CLOUDMOLD_DUBBO_REGISTRY:nacos://127.0.0.1:8848}}
    group: ${CLOUDMOLD_DUBBO_REGISTRY_GROUP:CLOUDMOLD_DUBBO}
  protocol:
    name: dubbo
    port: ${CLOUDMOLD_SKILL_DUBBO_PORT:20882}
    serialization: hessian2
  provider:
    timeout: ${CLOUDMOLD_RPC_TIMEOUT_MILLIS:5000}
    retries: 0
  consumer:
    check: true
    timeout: ${CLOUDMOLD_RPC_TIMEOUT_MILLIS:5000}
    retries: 0

yudao:
  info:
    base-package: cn.iocoder.yudao
  tenant:
    enable: false
